name: Publish all-branches integration

on:
  push:
    branches:
      - agent/all-branches-integration-publish
    paths:
      - .github/workflows/publish-all-branches-integration.yml

permissions:
  contents: write

concurrency:
  group: face-attendance-all-branches-integration
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify and reconstruct the reviewed patch
        shell: bash
        env:
          BASE_SHA: 0006ed95165fcde9a03f354821abe4297d05752b
          BASE64_SHA256: 6e2c689f93ba80f1f501e4818b7adfa428a0f6fbc7848a0206f598e81c524b84
          PATCH_SHA256: 721bf1f85e86e6fd2bb2b58333e23f2074e61c336154bc5f42e10fb2bf871350
        run: |
          set -euo pipefail
          cat > /tmp/chunk-checksums <<'EOF'
          463a060d79752c48c1159d6b6aea499af6544abf34c750d17390cd24c695a7bb  integration.publish/part00
          8a250387cc236e7460f4ed9eacd510b42d8327d940070d8e99592b3d35e6d062  integration.publish/part01
          d537f57d5e8b4c3aced09e1f6a099bfa10e841e5a7f32123a9ba43ead027cec7  integration.publish/part02
          88572d437611b682d89f6369045227fa4b13c3e00eaa30e61a89912b01350852  integration.publish/part03
          59d5ba8d6298a8385e4c810e97ec7096f11e5100a71ab0ec4dca63252255ca00  integration.publish/part04
          dddac6b2ae4eaf0588f4c1715825ea912630e5e047612582366f6fbccfc40df5  integration.publish/part05a
          93842198009dcaed94b327d54faf3eb79a961c34ce14c97c55401d4b51d0338b  integration.publish/part05b
          d93d74eb1d8215ec4fcef4705d390a577fdd1db84124da9b80dae28eec29b119  integration.publish/part06
          a3c4f12402ca8b480888ead2e48a89302e89229a56e3096dce4db0c64b4cda5f  integration.publish/part07
          226bc805a9ff03b4d8202d83beb43c0ea83838589d9161469e32c29d3197ff0c  integration.publish/part08
          EOF
          sha256sum --check --strict /tmp/chunk-checksums
          test "$(wc -c < integration.publish/part00)" -eq 6000
          test "$(wc -c < integration.publish/part01)" -eq 6000
          test "$(wc -c < integration.publish/part02)" -eq 6000
          test "$(wc -c < integration.publish/part03)" -eq 6000
          test "$(wc -c < integration.publish/part04)" -eq 6000
          test "$(wc -c < integration.publish/part05a)" -eq 3000
          test "$(wc -c < integration.publish/part05b)" -eq 3000
          test "$(wc -c < integration.publish/part06)" -eq 6000
          test "$(wc -c < integration.publish/part07)" -eq 6000
          test "$(wc -c < integration.publish/part08)" -eq 5668

          cat \
            integration.publish/part00 \
            integration.publish/part01 \
            integration.publish/part02 \
            integration.publish/part03 \
            integration.publish/part04 \
            integration.publish/part05a \
            integration.publish/part05b \
            integration.publish/part06 \
            integration.publish/part07 \
            integration.publish/part08 \
            > /tmp/integration.patch.gz.b64
          test "$(wc -c < /tmp/integration.patch.gz.b64)" -eq 53668
          echo "$BASE64_SHA256  /tmp/integration.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/integration.patch.gz.b64 > /tmp/integration.patch.gz
          gzip --test /tmp/integration.patch.gz
          gzip --decompress --stdout /tmp/integration.patch.gz > /tmp/integration.patch
          test "$(wc -c < /tmp/integration.patch)" -eq 184186
          echo "$PATCH_SHA256  /tmp/integration.patch" | sha256sum --check --strict
          git cat-file -e "$BASE_SHA^{commit}"

      - name: Assemble the clean integration tree
        shell: bash
        env:
          BASE_SHA: 0006ed95165fcde9a03f354821abe4297d05752b
          EXPECTED_TREE_SHA: 7b20fd9ff19bd14de24a33572a7e13f770bdf10c
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git apply --check --verbose /tmp/integration.patch
          git apply --index /tmp/integration.patch
          test ! -e integration.publish
          test ! -e .github/workflows/publish-all-branches-integration.yml
          git diff --cached --check
          actual_tree=$(git write-tree)
          echo "Expected tree: $EXPECTED_TREE_SHA"
          echo "Actual tree:   $actual_tree"
          test "$actual_tree" = "$EXPECTED_TREE_SHA"
          git diff --cached --stat

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"

      - name: Compile Python files
        run: |
          python -m py_compile *.py
          python -m compileall -q \
            frappe_apps/face_attendance_idempotency/face_attendance_idempotency

      - name: Run complete lightweight test suite
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_event_ledger.py \
            test_event_operations.py \
            test_processing_recovery.py \
            test_event_identity.py \
            test_event_tombstones.py \
            test_runtime_schema_fixtures.py \
            test_erpnext_adapter.py \
            test_delivery_outbox.py \
            test_delivery_worker.py \
            test_attachment_outbox.py \
            test_attachment_worker.py \
            test_erpnext_idempotency.py \
            test_h0_credential_auth.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py

      - name: Validate configuration, metadata, and shell templates
        run: |
          python -m json.tool config.example.json >/dev/null
          python -m json.tool tests/fixtures/manifest.json >/dev/null
          python - <<'PY'
          import tomllib
          from pathlib import Path

          app = Path("frappe_apps/face_attendance_idempotency")
          metadata = tomllib.loads((app / "pyproject.toml").read_text())
          assert metadata["project"]["name"] == "face-attendance-idempotency"
          assert (app / "face_attendance_idempotency" / "api.py").is_file()
          assert (app / "face_attendance_idempotency" / "install.py").is_file()
          assert (app / "MANIFEST.in").is_file()
          PY
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          test -s docs/erpnext-idempotency.md
          test -s docs/attachment-jobs.md
          grep -F -- '- [x] `P2-04`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P2-05`' docs/attendance-platform-plan.md

      - name: Verify tests did not mutate the reviewed source tree
        shell: bash
        env:
          EXPECTED_TREE_SHA: 7b20fd9ff19bd14de24a33572a7e13f770bdf10c
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git diff --exit-code
          unexpected=$(git ls-files --others --exclude-standard)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected untracked files after tests:\n%s\n' "$unexpected"
            exit 1
          fi
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE_SHA"

      - name: Publish clean integrated branch
        id: publish
        shell: bash
        env:
          BASE_SHA: 0006ed95165fcde9a03f354821abe4297d05752b
          EXPECTED_TREE_SHA: 7b20fd9ff19bd14de24a33572a7e13f770bdf10c
          TARGET_BRANCH: agent/all-branches-integrated
        run: |
          set -euo pipefail
          tree=$(git write-tree)
          test "$tree" = "$EXPECTED_TREE_SHA"
          export GIT_AUTHOR_NAME="Yasser"
          export GIT_AUTHOR_EMAIL="116118149+YrFnS@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Integrate all recoverable branch changes and fix migration conflicts' \
            | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Published $TARGET_BRANCH at $commit with tree $tree"
