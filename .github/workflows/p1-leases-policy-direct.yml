name: P1 leases and policy validation

on:
  push:
    branches:
      - agent/p1-leases-policy-stage

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Check out prepared implementation
        env:
          BASE_SHA: a21d228e18781390855978ecd9c3dfcf0c4a04f9
        run: |
          git fetch origin agent/p1-leases-policy-direct
          prepared=$(git rev-parse origin/agent/p1-leases-policy-direct)
          test "$prepared" != "$BASE_SHA"
          test "$(git rev-parse "$prepared^")" = "$BASE_SHA"
          git show "$prepared:processing_state.py" >/dev/null
          git checkout --detach "$prepared"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run repository tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_processing_state.py \
            test_h0_credential_auth.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Validate configuration and templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          grep -F -- '- [x] `P1-05`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P1-06`' docs/attendance-platform-plan.md
          test -s docs/processing-leases-and-policy.md
          git diff --check HEAD^
      - name: Publish clean stacked branch
        env:
          TARGET_BRANCH: agent/p1-leases-policy
        run: |
          commit=$(git rev-parse HEAD)
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
