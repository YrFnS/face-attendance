name: Apply H0 canonical watcher enforcement

on:
  push:
    branches:
      - agent/h0-canonical-watcher

permissions:
  contents: write

jobs:
  apply-canonical-watcher:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/h0-canonical-watcher
          fetch-depth: 0

      - name: Apply canonical watcher changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          ROOT = Path('.')


          def replace_once(path, old, new):
              path = ROOT / path
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one match in {path} but found {count}: {old[:120]!r}"
                  )
              path.write_text(text.replace(old, new), encoding='utf-8')


          watcher_policy = '''"""Production and legacy watcher entry-point policy."""

CANONICAL_WATCHER = "watch_service.py"
LEGACY_WATCHER_COMMANDS = frozenset({"watch", "watch-folder"})


def require_legacy_dry_run(command, *, dry_run):
    """Refuse legacy watcher commands unless they are explicitly non-delivering."""

    command = str(command or "").strip()
    if command not in LEGACY_WATCHER_COMMANDS:
        raise ValueError(f"unknown legacy watcher command: {command or '<empty>'}")
    if bool(dry_run):
        return
    raise SystemExit(
        f"Refusing live legacy watcher '{command}'. It bypasses production "
        "readiness, PAD, replay protection, and the durable event ledger. "
        f"Use 'python {CANONICAL_WATCHER}' for live processing. For controlled "
        f"diagnostics only, rerun 'python face_attendance.py {command} --dry-run'."
    )
'''
          (ROOT / 'watcher_entrypoints.py').write_text(watcher_policy, encoding='utf-8')

          replace_once(
              'face_attendance.py',
              '''    write_gallery_atomic,\n)\n\n\nROOT = Path(__file__).resolve().parent\n''',
              '''    write_gallery_atomic,\n)\nfrom watcher_entrypoints import require_legacy_dry_run\n\n\nROOT = Path(__file__).resolve().parent\n''',
          )
          replace_once(
              'face_attendance.py',
              '''def watch(once=False, dry_run=False):\n    cfg = load_config()\n''',
              '''def watch(once=False, dry_run=False):\n    require_legacy_dry_run("watch", dry_run=dry_run)\n    cfg = load_config()\n''',
          )
          replace_once(
              'face_attendance.py',
              '''def watch_folder(once=False, dry_run=False, scan_existing=False):\n    cfg = load_config()\n''',
              '''def watch_folder(once=False, dry_run=False, scan_existing=False):\n    require_legacy_dry_run("watch-folder", dry_run=dry_run)\n    cfg = load_config()\n''',
          )
          replace_once(
              'face_attendance.py',
              '''    run = sub.add_parser("watch")\n    run.add_argument("--once", action="store_true")\n    run.add_argument("--dry-run", action="store_true")\n\n    folder = sub.add_parser("watch-folder")\n    folder.add_argument("--once", action="store_true")\n    folder.add_argument("--dry-run", action="store_true")\n''',
              '''    run = sub.add_parser(\n        "watch",\n        help="Legacy RTSP diagnostics only; live processing is refused.",\n    )\n    run.add_argument("--once", action="store_true")\n    run.add_argument(\n        "--dry-run",\n        action="store_true",\n        help="Required safety flag for the legacy RTSP diagnostic path.",\n    )\n\n    folder = sub.add_parser(\n        "watch-folder",\n        help="Legacy folder diagnostics only; live processing is refused.",\n    )\n    folder.add_argument("--once", action="store_true")\n    folder.add_argument(\n        "--dry-run",\n        action="store_true",\n        help="Required safety flag for the legacy folder diagnostic path.",\n    )\n''',
          )

          start_face_attendance = r'''$ErrorActionPreference = 'Stop'

$Project = if ($env:FACE_ATTENDANCE_DIR) {
    [System.IO.Path]::GetFullPath($env:FACE_ATTENDANCE_DIR)
} else {
    $PSScriptRoot
}
$Python = Join-Path $Project '.venv\Scripts\python.exe'
$FtpReceiver = Join-Path $Project 'ftp_receiver.py'
$Watcher = Join-Path $Project 'watch_service.py'
$LogDir = Join-Path $Project 'logs'

foreach ($RequiredPath in @($Python, $FtpReceiver, $Watcher)) {
    if (-not (Test-Path -LiteralPath $RequiredPath -PathType Leaf)) {
        throw "Required file not found: $RequiredPath"
    }
}

function Get-RunningPythonProcess([string] $ScriptName) {
    $Pattern = [regex]::Escape($ScriptName)
    Get-CimInstance Win32_Process -Filter "name = 'python.exe' or name = 'pythonw.exe'" |
        Where-Object { $_.CommandLine -and $_.CommandLine -match $Pattern } |
        Select-Object -First 1
}

function Start-PythonBackground([string] $ScriptPath, [string] $LogStem) {
    $QuotedScript = '"' + $ScriptPath.Replace('"', '\"') + '"'
    Start-Process `
        -FilePath $Python `
        -ArgumentList @('-u', $QuotedScript) `
        -WorkingDirectory $Project `
        -WindowStyle Hidden `
        -RedirectStandardOutput (Join-Path $LogDir "$LogStem.out.log") `
        -RedirectStandardError (Join-Path $LogDir "$LogStem.err.log")
}

New-Item -ItemType Directory -Force -Path $LogDir | Out-Null

if (-not (Get-RunningPythonProcess 'ftp_receiver.py')) {
    Start-PythonBackground $FtpReceiver 'ftp'
}
if (Get-RunningPythonProcess 'watch_service.py') {
    throw 'The canonical watch_service.py process is already running.'
}

Push-Location $Project
try {
    & $Python -u $Watcher `
        1>> (Join-Path $LogDir 'watch.out.log') `
        2>> (Join-Path $LogDir 'watch.err.log')
    exit $LASTEXITCODE
} finally {
    Pop-Location
}
'''
          (ROOT / 'start_face_attendance.ps1').write_text(
              start_face_attendance, encoding='utf-8'
          )

