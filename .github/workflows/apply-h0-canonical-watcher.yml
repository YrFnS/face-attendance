import unittest
from pathlib import Path

from watcher_entrypoints import CANONICAL_WATCHER, require_legacy_dry_run


ROOT = Path(__file__).resolve().parent


class CanonicalWatcherTests(unittest.TestCase):
    def test_live_legacy_commands_are_refused(self):
        for command in ("watch", "watch-folder"):
            with self.subTest(command=command):
                with self.assertRaisesRegex(SystemExit, "watch_service.py"):
                    require_legacy_dry_run(command, dry_run=False)

    def test_legacy_dry_run_remains_available(self):
        for command in ("watch", "watch-folder"):
            with self.subTest(command=command):
                self.assertIsNone(require_legacy_dry_run(command, dry_run=True))

    def test_unknown_legacy_command_is_rejected(self):
        with self.assertRaisesRegex(ValueError, "unknown legacy watcher"):
            require_legacy_dry_run("unexpected", dry_run=True)

    def test_face_attendance_guards_before_watcher_side_effects(self):
        tree = ast.parse((ROOT / "face_attendance.py").read_text(encoding="utf-8"))
        functions = {
            node.name: node
            for node in tree.body
            if isinstance(node, ast.FunctionDef)
        }
        for function_name, command in (
            ("watch", "watch"),
            ("watch_folder", "watch-folder"),
        ):
            with self.subTest(function=function_name):
                first = functions[function_name].body[0]
                self.assertIsInstance(first, ast.Expr)
                call = first.value
                self.assertIsInstance(call, ast.Call)
                self.assertIsInstance(call.func, ast.Name)
                self.assertEqual(call.func.id, "require_legacy_dry_run")
                self.assertEqual(call.args[0].value, command)
                keyword = next(item for item in call.keywords if item.arg == "dry_run")
                self.assertIsInstance(keyword.value, ast.Name)
                self.assertEqual(keyword.value.id, "dry_run")

    def test_windows_launchers_use_only_the_canonical_watcher(self):
        launchers = (
            "start_face_attendance.ps1",
            "start_ftp_only.ps1",
            "install_auto_start.ps1",
        )
        for filename in launchers:
            with self.subTest(filename=filename):
                text = (ROOT / filename).read_text(encoding="utf-8")
                self.assertIn(CANONICAL_WATCHER, text)
                self.assertNotIn("face_attendance.py", text)
                self.assertIn("$PSScriptRoot", text)
                self.assertNotIn(r"C:\Users\E2NEXT", text)

    def test_windows_scheduled_tasks_cover_ftp_and_watcher(self):
        install = (ROOT / "install_auto_start.ps1").read_text(encoding="utf-8")
        stop = (ROOT / "stop_auto_start.ps1").read_text(encoding="utf-8")
        for task_name in (
            "Face Attendance FTP Receiver",
            "Face Attendance Watcher",
        ):
            self.assertIn(task_name, install)
            self.assertIn(task_name, stop)
        self.assertIn("-MultipleInstances IgnoreNew", install)

    def test_linux_service_and_installer_use_canonical_watcher(self):
        service = (
            ROOT / "deploy/systemd/face-attendance-watch.service"
        ).read_text(encoding="utf-8")
        installer = (ROOT / "install_linux.sh").read_text(encoding="utf-8")
        self.assertIn(
            "ExecStart=/opt/face-attendance/.venv/bin/python -u "
            "/opt/face-attendance/watch_service.py",
            service,
        )
        self.assertIn(
            'if [ -s "$APP_DIR/embedding_gallery.json" ]; then',
            installer,
        )
        self.assertNotIn(
            '|| [ -s "$APP_DIR/embeddings.pkl" ]',
            installer,
        )
        self.assertIn("does not enable the watcher", installer)

    def test_operator_docs_name_one_live_entry_point(self):
        readme = (ROOT / "README.md").read_text(encoding="utf-8")
        security = (ROOT / "docs/security-hardening.md").read_text(
            encoding="utf-8"
        )
        self.assertIn("only supported live watcher", readme)
        self.assertIn("only supported live watcher", security)
        self.assertIn("refuse non-dry-run", readme)


if __name__ == "__main__":
    unittest.main()
'''
