name: Apply H0 canonical watcher enforcement

on:
  push:
    branches:
      - agent/h0-canonical-watcher

permissions:
  contents: write

jobs:
  apply-canonical-watcher:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/h0-canonical-watcher
          fetch-depth: 0

      - name: Apply canonical entry points and documentation
        run: |
          python .github/apply_h0_core.py
          python .github/apply_h0_windows.py
          python .github/apply_h0_docs.py
          python -c 'from pathlib import Path; p=Path("install_linux.sh"); t=p.read_text(); old="if [ -s \"$APP_DIR/embedding_gallery.json\" ] || [ -s \"$APP_DIR/embeddings.pkl\" ]; then"; new="if [ -s \"$APP_DIR/embedding_gallery.json\" ]; then"; assert t.count(old)==1; p.write_text(t.replace(old,new))'
          python -c 'from pathlib import Path; p=Path("install_linux.sh"); t=p.read_text(); old="Watcher left stopped: configure and sync a valid embedding gallery first."; new="Watcher left stopped: configure and sync a valid embedding_gallery.json first; a legacy pickle does not enable live processing."; assert t.count(old)==1; p.write_text(t.replace(old,new))'
          python -c 'from pathlib import Path; p=Path("deploy/systemd/face-attendance-watch.service"); t=p.read_text(); old="ExecStart=/opt/face-attendance/.venv/bin/python -u watch_service.py"; new="ExecStart=/opt/face-attendance/.venv/bin/python -u /opt/face-attendance/watch_service.py"; assert t.count(old)==1; p.write_text(t.replace(old,new))'
          python -c 'from pathlib import Path; p=Path("deploy/systemd/face-attendance-watch.service"); t=p.read_text(); old="Description=Face Attendance Replay-Resistant Folder Watcher"; new="Description=Face Attendance Canonical Replay-Resistant Folder Watcher"; assert t.count(old)==1; p.write_text(t.replace(old,new))'

      - name: Validate focused changes
        run: |
          python -m py_compile face_attendance.py watcher_entrypoints.py test_canonical_watcher.py
          python -m unittest -v test_canonical_watcher.py test_install_linux.py
          bash -n install_linux.sh

      - name: Commit implementation
        run: |
          rm -f \
            .github/workflows/apply-h0-canonical-watcher.yml \
            .github/apply_h0_core.py \
            .github/apply_h0_windows.py \
            .github/apply_h0_docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'enforce canonical production watcher'
          git push origin HEAD:agent/h0-canonical-watcher
