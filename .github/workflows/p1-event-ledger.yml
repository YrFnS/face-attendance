name: P1 event ledger

on:
  push:
    branches:
      - agent/p1-event-ledger-stage

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble reviewed P1 ledger implementation
        run: |
          cat p1_event_ledger.part.* > event_ledger.py
          cat p1_patch.part.* > p1_apply_event_ledger.py
          python p1_apply_event_ledger.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run repository tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_event_ledger.py \
            test_h0_credential_auth.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Exercise schema-v1 to schema-v2 migration
        run: |
          tmpdir=$(mktemp -d)
          export P1_DB="$tmpdir/runtime_state.sqlite3"
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path
          from runtime_state import (
              BASELINE_SCHEMA_STATEMENTS,
              MIGRATION_BY_VERSION,
              RUNTIME_SCHEMA_VERSION,
              RuntimeState,
              make_event_id,
              utc_now,
          )

          path = Path(os.environ["P1_DB"])
          connection = sqlite3.connect(path)
          try:
              for statement in BASELINE_SCHEMA_STATEMENTS:
                  connection.execute(statement)
              migration = MIGRATION_BY_VERSION[1]
              connection.execute(
                  "INSERT INTO schema_migrations "
                  "(version, name, checksum, applied_at) VALUES (?, ?, ?, ?)",
                  (1, migration.name, migration.checksum, utc_now()),
              )
              connection.execute("PRAGMA user_version = 1")
              event_id = make_event_id("legacy-camera", "IN", "legacy-content")
              connection.execute(
                  """
                  INSERT INTO camera_events (
                      event_id, camera_id, log_type, source_sha256, source_name,
                      source_mtime, source_size, status, created_unix, updated_unix,
                      completed_at, error
                  ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                  """,
                  (
                      event_id,
                      "legacy-camera",
                      "IN",
                      "legacy-content",
                      "legacy.jpg",
                      1.0,
                      12,
                      "processed",
                      1.0,
                      2.0,
                      "2026-08-13T00:00:00Z",
                      "",
                  ),
              )
              connection.commit()
          finally:
              connection.close()

          state = RuntimeState(path, backup_dir=path.parent / "backups")
          report = state.migration_status()
          assert report["ok"], report
          assert report["schema_version"] == RUNTIME_SCHEMA_VERSION == 2
          event = state.get_event(event_id)
          assert event["reason_code"] == "legacy_import", event
          assert event["transitions"][0]["reason_code"] == "legacy_import", event
          assert state.last_migration_backup is not None
          print(report)
          PY
          python runtime_state_admin.py verify --database "$P1_DB"
          backup=$(find "$tmpdir/backups" -name '*.sqlite3' -type f | head -n 1)
          python runtime_state_admin.py verify-backup "$backup"
      - name: Validate documentation and templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          grep -F -- '- [x] `P1-03`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P1-04`' docs/attendance-platform-plan.md
          test -s docs/versioned-event-ledger.md
          git diff --check
      - name: Publish clean stacked branch
        env:
          BASE_SHA: bcbecd49c948a2b5464963ec604991432bc5b1ee
          TARGET_BRANCH: agent/p1-event-ledger
        run: |
          rm -f p1_event_ledger.part.* p1_patch.part.* p1_apply_event_ledger.py
          rm -f .github/workflows/p1-event-ledger.yml
          git add -A
          git diff --cached --check
          echo "Final changed files:"
          git diff --cached --name-only
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'add versioned event ledger and durable recognition evidence' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
