name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - agent/sync-embedding-gallery
      - agent/h0-gallery-contract-work

permissions:
  contents: write

jobs:
  security-and-gallery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply staged H0-07 implementation
        if: github.ref == 'refs/heads/agent/h0-gallery-contract-work' || github.head_ref == 'agent/h0-gallery-contract-work'
        run: |
          cat .h0/embedding-gallery-* > embedding_gallery.py
          python h0_apply_min.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run lightweight tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Validate configuration and shell templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          git diff --check
      - name: Publish clean stacked branch
        if: github.ref == 'refs/heads/agent/h0-gallery-contract-work'
        env:
          BASE_SHA: 8a63000f9cb451c22cf6e89d54a552db959581f2
          TARGET_BRANCH: agent/h0-gallery-data-contract
        run: |
          git show "$BASE_SHA:.github/workflows/tests.yml" > .github/workflows/tests.yml
          rm -rf .h0
          rm -f h0_apply_min.py h0_runtime_actual.py h0_web_import_actual.py
          git add -A
          git diff --cached --check
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'enforce gallery and employee data contracts' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
