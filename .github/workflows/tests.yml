name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - agent/sync-embedding-gallery

permissions:
  contents: read

jobs:
  security-and-gallery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib>=2.0.1,<3" \
            "requests>=2.32.3,<3"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run lightweight tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_runtime_state.py \
            test_web_security.py \
            test_web_admin.py
      - name: Validate shell scripts
        run: bash -n install_linux.sh
