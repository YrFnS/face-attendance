name: Diagnose Phase 2 branch inventory

on:
  push:
    branches:
      - agent/p2-live-acceptance-publish
    paths:
      - .github/workflows/diagnose-phase2-publication.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Inspect every remote P2 branch
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/phase2-branch-inventory
          mkdir -p "$out/candidates"
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'

          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            branch commit tree files p2_checked attachment idempotency acceptance reconciliation \
            > "$out/branches.tsv"

          while read -r ref; do
            branch=${ref#refs/remotes/origin/}
            case "$branch" in
              agent/p2*|agent/p204*) ;;
              *) continue ;;
            esac
            commit=$(git rev-parse "$ref")
            tree=$(git rev-parse "$ref^{tree}")
            files=$(git ls-tree -r --name-only "$ref" | wc -l | tr -d ' ')

            p2_checked=0
            if git cat-file -e "$ref:docs/attendance-platform-plan.md" 2>/dev/null; then
              p2_checked=$(git show "$ref:docs/attendance-platform-plan.md" \
                | grep -Ec '^- \[x\] `P2-(0[1-9]|1[01])`' || true)
            fi

            attachment=0
            git cat-file -e "$ref:attachment_outbox.py" 2>/dev/null && attachment=1 || true
            idempotency=0
            git cat-file -e "$ref:erpnext_idempotency.py" 2>/dev/null && idempotency=1 || true
            acceptance=0
            git cat-file -e "$ref:staging_acceptance.py" 2>/dev/null && acceptance=1 || true
            reconciliation=0
            if git ls-tree -r --name-only "$ref" \
                | grep -Eq 'reconcil|dead.?letter|delivery_admin|acceptance\.py'; then
              reconciliation=1
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$branch" "$commit" "$tree" "$files" "$p2_checked" \
              "$attachment" "$idempotency" "$acceptance" "$reconciliation" \
              >> "$out/branches.tsv"

            if [ "$p2_checked" -ge 4 ] || [ "$acceptance" -eq 1 ] || \
               { [ "$attachment" -eq 1 ] && [ "$idempotency" -eq 1 ]; }; then
              safe=$(printf '%s' "$branch" | tr '/' '_')
              git archive --format=tar.gz -o "$out/candidates/$safe.tar.gz" "$ref"
              git ls-tree -r --name-only "$ref" > "$out/candidates/$safe.files.txt"
              git diff --name-status 0006ed95165fcde9a03f354821abe4297d05752b "$ref" \
                > "$out/candidates/$safe.vs-private-crop.txt" || true
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)

          column -t -s $'\t' "$out/branches.tsv" > "$out/branches.txt"
          cat "$out/branches.txt"
      - name: Upload branch inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase2-branch-inventory
          path: /tmp/phase2-branch-inventory/
          if-no-files-found: error
          retention-days: 1
