name: P1 event inspection and operator workflows

on:
  push:
    branches:
      - agent/p1-event-operations-stage

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply reviewed P1 operator patch
        run: |
          cat p1_event_operations.patch.gz.b64.part.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/p1-event-operations.patch
          echo "470fb1f5e0cb5741bd6fafe6af3f56983c2c6a057d39593985c4614c3b3991b2  /tmp/p1-event-operations.patch" | sha256sum --check
          git apply --whitespace=error-all /tmp/p1-event-operations.patch
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run repository and operator tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_event_ledger.py \
            test_event_operations.py \
            test_processing_recovery.py \
            test_h0_credential_auth.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Exercise schema-v3 to schema-v4 migration and CLI
        run: |
          tmpdir=$(mktemp -d)
          export P1_DB="$tmpdir/runtime_state.sqlite3"
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path
          from runtime_state import MIGRATION_BY_VERSION, RUNTIME_SCHEMA_VERSION, RuntimeState, utc_now

          path = Path(os.environ["P1_DB"])
          connection = sqlite3.connect(path)
          try:
              for version in (1, 2, 3):
                  migration = MIGRATION_BY_VERSION[version]
                  for statement in migration.statements:
                      connection.execute(statement)
                  connection.execute(
                      "INSERT INTO schema_migrations "
                      "(version, name, checksum, applied_at) VALUES (?, ?, ?, ?)",
                      (version, migration.name, migration.checksum, utc_now()),
                  )
                  connection.execute(f"PRAGMA user_version = {version}")
              connection.commit()
          finally:
              connection.close()

          state = RuntimeState(path, backup_dir=path.parent / "backups")
          report = state.migration_status()
          assert report["ok"], report
          assert report["schema_version"] == RUNTIME_SCHEMA_VERSION == 4
          assert state.last_migration_backup is not None
          print(report)
          PY
          python runtime_state_admin.py verify --database "$P1_DB"
          python event_admin.py --help >/dev/null
          python event_admin.py list --database "$P1_DB" --limit 5 >/dev/null
          backup=$(find "$tmpdir/backups" -name '*.sqlite3' -type f | head -n 1)
          python runtime_state_admin.py verify-backup "$backup"
      - name: Validate documentation and templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          grep -F -- '- [x] `P1-07`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P1-08`' docs/attendance-platform-plan.md
          test -s docs/event-operations.md
          ! grep -Eq 'delivery-(retry|cancel)' <(python event_admin.py --help)
          git diff --check
      - name: Publish clean stacked branch
        env:
          BASE_SHA: 87aea213f5f612a343d3213cdc7433806eb235d9
          TARGET_BRANCH: agent/p1-event-operations
        run: |
          rm -f p1_event_operations.patch.gz.b64
          rm -f p1_event_operations.patch.gz.b64.part.*
          rm -f .github/workflows/p1-event-operations-stage.yml
          git add -A
          git diff --cached --check
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'add audited event inspection and operator workflows' | git commit-tree "$tree" -p "$BASE_SHA")
          echo "Final changed files:"
          git diff-tree --no-commit-id --name-only -r "$commit"
          test "$(git diff-tree --no-commit-id --name-only -r "$commit" | wc -l)" -eq 17
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
