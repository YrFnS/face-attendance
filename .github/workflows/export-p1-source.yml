name: Export P1 source snapshot

on:
  push:
    branches:
      - agent/p1-lease-policy-dev

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Package repository source
        run: |
          tar --exclude=.git --exclude=source-snapshot.tar.gz -czf source-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: p1-source-snapshot
          path: source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
