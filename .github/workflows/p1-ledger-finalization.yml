name: P1 ledger finalization

on:
  push:
    branches:
      - agent/p1-ledger-finalization-stage

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble reviewed implementation and released-schema fixtures
        run: |
          echo "299304980d8c68711757f18b7327125dbfd5463d680077fbd43c50fb94e12f5f  p1-ledger-finalization-source.tar.gz" | sha256sum --check
          tar -xzf p1-ledger-finalization-source.tar.gz
          python p1_generate_released_fixtures.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run complete repository test discovery
        run: python -m unittest discover -v
      - name: Exercise identifier and released-schema acceptance explicitly
        run: |
          python -m unittest -v \
            test_event_identity.py \
            test_runtime_state_fixtures.py \
            test_event_ledger.py \
            test_event_operations.py \
            test_watch_service.py
      - name: Validate configuration, documentation, and shell templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          grep -F -- '- [x] `P1-09`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P1-10`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P1-11`' docs/attendance-platform-plan.md
          test -s docs/event-id-semantics.md
          test -s test_fixtures/runtime_state/manifest.json
          git diff --check
      - name: Publish clean stacked branch
        env:
          BASE_SHA: 2faafd647ac5833ee16746c553e0a845a6b31f11
          TARGET_BRANCH: agent/p1-ledger-finalization
        run: |
          git reset "$BASE_SHA"
          rm -f p1-ledger-finalization-source.tar.gz
          rm -f p1_generate_released_fixtures.py
          rm -f .github/workflows/p1-ledger-finalization.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/tests.yml
          README.md
          docs/attendance-platform-plan.md
          docs/event-id-semantics.md
          docs/event-operations.md
          docs/runtime-state-migrations.md
          docs/versioned-event-ledger.md
          event_identity.py
          event_ledger.py
          event_operations.py
          runtime_state.py
          test_event_identity.py
          test_event_ledger.py
          test_event_operations.py
          test_fixtures/runtime_state/README.md
          test_fixtures/runtime_state/manifest.json
          test_fixtures/runtime_state/schema-v1.json
          test_fixtures/runtime_state/schema-v1.sqlite3
          test_fixtures/runtime_state/schema-v2.json
          test_fixtures/runtime_state/schema-v2.sqlite3
          test_fixtures/runtime_state/schema-v3.json
          test_fixtures/runtime_state/schema-v3.sqlite3
          test_fixtures/runtime_state/schema-v4.json
          test_fixtures/runtime_state/schema-v4.sqlite3
          test_runtime_state_fixtures.py
          test_watch_service.py
          watch_service.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'finalize Phase 1 ledger identity and replay safety' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
