name: Apply H0 strict production profile

on:
  push:
    branches:
      - agent/h0-strict-production-profile-work

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/h0-strict-production-profile-work
          fetch-depth: 0

      - name: Repair staged patch source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apply_h0_strict_profile.py')
          text = path.read_text(encoding='utf-8')
          for token in (chr(36), 'self', 'unsafe-inline', 'none'):
              text = text.replace("'" + token + "'", "\\'" + token + "\\'")
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile apply_h0_strict_profile.py

      - name: Apply strict production profile
        run: python apply_h0_strict_profile.py

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'flask>=3.0.3,<4' \
            'gunicorn>=26.0.0,<27' \
            'numpy>=1.26.4' \
            'opencv-python-headless>=4.10.0,<5' \
            'pyftpdlib>=2.0.1,<3' \
            'requests>=2.32.3,<3'

      - name: Validate implementation
        run: |
          python -m py_compile *.py
          python -m unittest -v \
            test_embedding_gallery.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          grep -q 'root=binding\["insightface_root"\]' model_runtime.py
          grep -q 'strict production gallery policy' runtime_policy.py
          ! grep -q 'password_hash.startswith("scrypt\\$")' production_readiness.py

      - name: Commit implementation
        run: |
          rm -f apply_h0_strict_profile.py .github/workflows/apply-h0-strict-production-profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'enforce strict production runtime policy'
          git push origin HEAD:agent/h0-strict-production-profile-work
