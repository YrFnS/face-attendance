name: Publish strict production profile

on:
  push:
    branches:
      - agent/h0-strict-production-profile-work

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/h0-strict-production-profile-work
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Generate, validate, and publish
        run: bash publish_h0_strict_profile.sh
