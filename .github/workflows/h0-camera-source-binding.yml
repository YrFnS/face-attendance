name: H0-09 camera source binding

on:
  push:
    branches:
      - agent/h0-camera-source-binding-stage

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble reviewed H0-09 files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python h0_apply_camera_source_binding.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run repository tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Validate configuration and shell templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          git diff --check
      - name: Publish clean stacked branch
        env:
          BASE_SHA: a4dbc78ab071f0f09010178a07e85d8a9216b78e
          TARGET_BRANCH: agent/h0-camera-source-binding
        run: |
          rm -rf .h0
          rm -f h0_apply_camera_source_binding.py h0_camera_source_payload_*.txt
          rm -f .github/workflows/h0-camera-source-binding.yml
          git add -A
          git diff --cached --check
          echo "Changed files:"
          git diff --cached --name-only
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'bind camera credentials routes and networks' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
