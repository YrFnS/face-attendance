name: Validate and publish P2-04 idempotency

on:
  pull_request:
    branches:
      - agent/p2-delivery-worker
    paths:
      - p204.payload/**
      - .github/workflows/p2-erpnext-idempotency-pr-build.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble clean P2-04 tree
        env:
          BASE_SHA: a3011e16ea8816901b16b8a630588c83e50d8a23
          PATCH_SHA256: d1156dffd20586f3983af0f2aa6d93fb70ea8120e4f47815c75a9c3a8db9fa8b
        run: |
          cat p204.payload/part* > /tmp/p204.patch.gz.b64
          base64 -d /tmp/p204.patch.gz.b64 | gzip -d > /tmp/p204.patch
          echo "$PATCH_SHA256  /tmp/p204.patch" | sha256sum -c -
          git reset --hard "$BASE_SHA"
          git apply --index /tmp/p204.patch
          python - <<'PY_WRITE'
          import base64
          from pathlib import Path
          Path('.github/workflows/tests.yml').write_bytes(base64.b64decode(''))
          PY_WRITE
          git add .github/workflows/tests.yml
          git diff --cached --check
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: |
          python -m py_compile *.py
          python -m compileall -q frappe_apps/face_attendance_idempotency/face_attendance_idempotency
      - name: Run complete repository suite
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_event_ledger.py \
            test_event_operations.py \
            test_processing_recovery.py \
            test_event_identity.py \
            test_event_tombstones.py \
            test_runtime_schema_fixtures.py \
            test_erpnext_adapter.py \
            test_delivery_outbox.py \
            test_delivery_worker.py \
            test_erpnext_idempotency.py \
            test_h0_credential_auth.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Validate configuration app and docs
        run: |
          python -m json.tool config.example.json >/dev/null
          python -m json.tool tests/fixtures/manifest.json >/dev/null
          python - <<'PY_CHECK'
          import tomllib
          from pathlib import Path
          app = Path('frappe_apps/face_attendance_idempotency')
          metadata = tomllib.loads((app / 'pyproject.toml').read_text())
          assert metadata['project']['name'] == 'face-attendance-idempotency'
          assert (app / 'face_attendance_idempotency' / 'api.py').is_file()
          assert (app / 'face_attendance_idempotency' / 'install.py').is_file()
          assert (app / 'MANIFEST.in').is_file()
          PY_CHECK
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          test -s docs/erpnext-idempotency.md
          grep -F -- '- [x] `P2-04`' docs/attendance-platform-plan.md
          git diff --cached --check
      - name: Publish one-commit stacked branch
        env:
          BASE_SHA: a3011e16ea8816901b16b8a630588c83e50d8a23
          TARGET_BRANCH: agent/p2-erpnext-idempotency
        run: |
          git diff --cached --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF_FILES'
          .github/workflows/tests.yml
          HANDOFF.md
          README.md
          config.example.json
          delivery_outbox.py
          delivery_service.py
          docs/attendance-platform-plan.md
          docs/delivery-outbox.md
          docs/delivery-worker.md
          docs/erpnext-idempotency.md
          docs/runtime-state-migrations.md
          erpnext_adapter.py
          erpnext_idempotency.py
          face_attendance.py
          frappe_apps/face_attendance_idempotency/MANIFEST.in
          frappe_apps/face_attendance_idempotency/README.md
          frappe_apps/face_attendance_idempotency/face_attendance_idempotency/__init__.py
          frappe_apps/face_attendance_idempotency/face_attendance_idempotency/api.py
          frappe_apps/face_attendance_idempotency/face_attendance_idempotency/contract.py
          frappe_apps/face_attendance_idempotency/face_attendance_idempotency/hooks.py
          frappe_apps/face_attendance_idempotency/face_attendance_idempotency/install.py
          frappe_apps/face_attendance_idempotency/face_attendance_idempotency/modules.txt
          frappe_apps/face_attendance_idempotency/face_attendance_idempotency/patches.txt
          frappe_apps/face_attendance_idempotency/license.txt
          frappe_apps/face_attendance_idempotency/pyproject.toml
          runtime_state.py
          test_delivery_outbox.py
          test_delivery_worker.py
          test_erpnext_idempotency.py
          test_production_readiness.py
          test_runtime_schema_fixtures.py
          watch_service.py
          EOF_FILES
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'add ERPNext atomic delivery idempotency' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
