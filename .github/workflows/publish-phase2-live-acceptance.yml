name: Publish validated Phase 2 completion

on:
  push:
    branches:
      - agent/p2-live-acceptance-publish
    paths:
      - phase2.publish/READY

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble final Phase 2 patch
        env:
          BASE_SHA: 0006ed95165fcde9a03f354821abe4297d05752b
          PATCH_SHA256: 0da08bfe0df549092634cb7f36b91e9737c4b7a2346cb34caaca4300ed3b6a5c
        run: |
          cat phase2.publish/part* > /tmp/phase2.patch.gz.b64
          base64 -d /tmp/phase2.patch.gz.b64 | gzip -d > /tmp/phase2.patch
          echo "$PATCH_SHA256  /tmp/phase2.patch" | sha256sum -c -
          git reset --hard "$BASE_SHA"
          git apply --index /tmp/phase2.patch
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git add -A
          git diff --cached --check
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile all Python sources
        run: |
          find . \
            -path './.git' -prune -o \
            -path './.venv' -prune -o \
            -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Run complete repository suite
        run: python -m unittest discover -v
      - name: Validate configuration, packaging, docs, and shell files
        run: |
          python -m json.tool config.example.json >/dev/null
          python -m json.tool tests/fixtures/manifest.json >/dev/null
          python staging_acceptance.py --help >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          test -s docs/live-production-acceptance.md
          test -s frappe_apps/face_attendance_idempotency/face_attendance_idempotency/acceptance.py
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/attendance-platform-plan.md').read_text(encoding='utf-8')
          for number in range(1, 12):
              marker = f'- [x] `P2-{number:02d}`'
              if marker not in text:
                  raise SystemExit(f'missing plan marker: {marker}')
          PY
          git diff --cached --check
      - name: Publish clean Phase 2 branch
        env:
          BASE_SHA: 0006ed95165fcde9a03f354821abe4297d05752b
          TARGET_BRANCH: agent/p2-phase2-complete
        run: |
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'complete Phase 2 and add live staging acceptance' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
          echo "Published $TARGET_BRANCH at $commit"
