name: Publish validated Phase 2 completion

on:
  push:
    branches:
      - agent/p2-live-acceptance-publish
    paths:
      - phase2.publish/READY

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble final source tree
        env:
          BASE_SHA: a3011e16ea8816901b16b8a630588c83e50d8a23
          ARCHIVE_SHA256: cb1885046cedd3a30f7761de3a91b8605a7eaac1e0491638ea06e9b09427cdb7
        run: |
          cat phase2.publish/part* > /tmp/phase2-source.tgz.b64
          base64 -d /tmp/phase2-source.tgz.b64 > /tmp/phase2-source.tgz
          echo "$ARCHIVE_SHA256  /tmp/phase2-source.tgz" | sha256sum -c -
          mkdir -p /tmp/phase2-source
          tar -xzf /tmp/phase2-source.tgz -C /tmp/phase2-source
          cp .github/workflows/tests.yml /tmp/base-tests.yml
          git reset --hard "$BASE_SHA"
          rsync -a --delete --exclude='.git' /tmp/phase2-source/ ./
          cp /tmp/base-tests.yml .github/workflows/tests.yml
          rm -rf phase2.publish
          rm -f .github/workflows/publish-phase2-live-acceptance.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          test ! -e phase2.publish
          test ! -e .github/workflows/publish-phase2-live-acceptance.yml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile all Python sources
        run: |
          find . \
            -path './.git' -prune -o \
            -path './.venv' -prune -o \
            -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Run complete repository suite
        run: python -m unittest discover -v
      - name: Validate configuration, packaging, docs, and shell files
        run: |
          python -m json.tool config.example.json >/dev/null
          python -m json.tool tests/fixtures/manifest.json >/dev/null
          python staging_acceptance.py --help >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          test -s docs/live-production-acceptance.md
          test -s frappe_apps/face_attendance_idempotency/face_attendance_idempotency/acceptance.py
          for item in $(seq -w 1 11); do
            grep -F -- "- [x] `P2-$item`" docs/attendance-platform-plan.md >/dev/null
          done
          git diff --cached --check
      - name: Publish clean Phase 2 branch
        env:
          BASE_SHA: a3011e16ea8816901b16b8a630588c83e50d8a23
          TARGET_BRANCH: agent/p2-phase2-complete
        run: |
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'complete Phase 2 and add live staging acceptance' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
          echo "Published $TARGET_BRANCH at $commit"
