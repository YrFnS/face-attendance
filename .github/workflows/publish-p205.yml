name: Publish P2-05 private crop attachments

on:
  push:
    branches:
      - agent/p2-private-crop-attachments-stage

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/p2-delivery-worker
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply reviewed P2-05 patch
        run: |
          cat .p205/patch-chunk-* | base64 --decode > /tmp/p205.patch.xz
          echo "61a15e10e1fa143a6ddd428adad4770fb3bf8e551e26f581f9d83d41105fe2c0  /tmp/p205.patch.xz" | sha256sum -c -
          xz -dc /tmp/p205.patch.xz > /tmp/p205.patch
          echo "ca4e733d62782c2da1090849a2c3738aada89a7c32beaad97c7911ce28d9d32d  /tmp/p205.patch" | sha256sum -c -
          git apply --check /tmp/p205.patch
          git apply /tmp/p205.patch
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run complete repository suite
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_event_ledger.py \
            test_event_operations.py \
            test_processing_recovery.py \
            test_event_identity.py \
            test_event_tombstones.py \
            test_runtime_schema_fixtures.py \
            test_erpnext_adapter.py \
            test_delivery_outbox.py \
            test_delivery_worker.py \
            test_attachment_outbox.py \
            test_attachment_worker.py \
            test_h0_credential_auth.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Validate configuration, plan, and service templates
        run: |
          python -m json.tool config.example.json >/dev/null
          python -m json.tool tests/fixtures/manifest.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          test -s docs/attachment-jobs.md
          grep -F -- '- [x] `P2-05`' docs/attendance-platform-plan.md
          grep -F -- '- [ ] `P2-04`' docs/attendance-platform-plan.md
          git diff --check
      - name: Publish clean stacked branch
        env:
          BASE_SHA: a3011e16ea8816901b16b8a630588c83e50d8a23
          TARGET_BRANCH: agent/p2-private-crop-attachments
        run: |
          git read-tree "$BASE_SHA"
          while IFS= read -r path; do
            git add -- "$path"
          done < .p205/manifest-runtime.txt
          git diff --cached "$BASE_SHA" --check
          git diff --cached "$BASE_SHA" --name-only | sort > /tmp/changed.txt
          sort .p205/manifest-runtime.txt > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'separate private crop attachment delivery' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
