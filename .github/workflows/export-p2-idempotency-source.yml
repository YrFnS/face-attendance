name: Export P2-04 source

on:
  push:
    branches:
      - agent/p2-idempotency-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare source snapshot
        run: |
          rm -rf .git
          tar -czf /tmp/face-attendance-p204-base.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: face-attendance-p204-base
          path: /tmp/face-attendance-p204-base.tar.gz
          retention-days: 1
