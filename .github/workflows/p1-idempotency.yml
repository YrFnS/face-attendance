name: P1 idempotency tombstones

on:
  push:
    branches:
      - agent/p1-idempotency-stage

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble identifier and tombstone changes
        run: |
          cat p1_idempotency_patch.*.part | base64 -d | gzip -d > p1_apply_idempotency.py
          python p1_apply_idempotency.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run repository tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
          python -m unittest -v \
            test_event_identity.py \
            test_idempotency_tombstones.py
      - name: Validate docs and templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          grep -F -- '- [x] `P1-10`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P1-11`' docs/attendance-platform-plan.md
          test -s docs/event-identifiers-and-tombstones.md
          git diff --check
      - name: Publish clean stacked branch
        env:
          BASE_SHA: 2faafd647ac5833ee16746c553e0a845a6b31f11
          TARGET_BRANCH: agent/p1-idempotency-tombstones
        run: |
          git read-tree "$BASE_SHA"
          git add \
            README.md \
            docs/attendance-platform-plan.md \
            docs/event-identifiers-and-tombstones.md \
            docs/event-operations.md \
            docs/runtime-state-migrations.md \
            docs/versioned-event-ledger.md \
            event_identity.py \
            event_ledger.py \
            event_operations.py \
            idempotency_tombstones.py \
            runtime_state.py \
            test_event_identity.py \
            test_idempotency_tombstones.py \
            test_event_ledger.py \
            test_event_operations.py \
            test_runtime_state.py \
            watch_service.py
          git diff --cached "$BASE_SHA" --check
          git diff --cached "$BASE_SHA" --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          README.md
          docs/attendance-platform-plan.md
          docs/event-identifiers-and-tombstones.md
          docs/event-operations.md
          docs/runtime-state-migrations.md
          docs/versioned-event-ledger.md
          event_identity.py
          event_ledger.py
          event_operations.py
          idempotency_tombstones.py
          runtime_state.py
          test_event_identity.py
          test_event_ledger.py
          test_event_operations.py
          test_idempotency_tombstones.py
          test_runtime_state.py
          watch_service.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'add replay tombstones and identifier contract' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
