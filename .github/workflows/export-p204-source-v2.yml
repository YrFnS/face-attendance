name: Export exact P2-04 base

on:
  push:
    branches:
      - agent/p204-source-export-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare exact PR 24 source snapshot
        run: |
          rm -rf .git
          tar -czf /tmp/face-attendance-pr24-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: face-attendance-pr24-source
          path: /tmp/face-attendance-pr24-source.tar.gz
          retention-days: 1
          if-no-files-found: error
