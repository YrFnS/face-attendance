name: P1 event operations

on:
  push:
    branches:
      - agent/p1-event-operations-stage-v2

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble and integrate reviewed event operations
        run: python p1_apply_event_operations.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run repository and event-operation tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_processing_recovery.py \
            test_event_admin.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Exercise the read-only CLI contract
        run: |
          tmpdir=$(mktemp -d)
          export EVENT_DB="$tmpdir/runtime_state.sqlite3"
          python - <<'PY'
          import os
          from pathlib import Path
          from event_ledger import make_capture_id
          from runtime_state import RuntimeState, make_event_id

          path = Path(os.environ["EVENT_DB"])
          state = RuntimeState(path, backup_dir=path.parent / "backups")
          digest = "a" * 64
          event_id = make_event_id("camera-in", "IN", digest)
          claim = state.record_event_receipt(
              event_id=event_id,
              capture_id=make_capture_id("camera-in", digest, "event.jpg", 10, 1.0),
              camera_id="camera-in",
              log_type="IN",
              source_sha256=digest,
              source_name="event.jpg",
              source_mtime=1.0,
              source_size=10,
              received_at="2026-08-14T00:00:00Z",
              effective_at="2026-08-14T00:00:00Z",
              branch="Baghdad",
              source_type="holowits_ftp",
              source_principal="camera_in",
              source_binding_id="b" * 64,
              policy="IN",
              receipt_state="verified",
              receipt_verified=True,
              receipt_detail={"signature": "must-not-leak"},
              policy_version="directional-v1",
          )
          assert claim.accepted
          print(event_id)
          PY
          event_id=$(python - <<'PY'
          from runtime_state import make_event_id
          print(make_event_id("camera-in", "IN", "a" * 64))
          PY
          )
          before=$(stat -c %Y "$EVENT_DB")
          python event_admin.py list --database "$EVENT_DB" --limit 10 > "$tmpdir/list.json"
          python event_admin.py inspect --database "$EVENT_DB" "$event_id" > "$tmpdir/inspect.json"
          python event_admin.py explain --database "$EVENT_DB" "$event_id" > "$tmpdir/explain.json"
          after=$(stat -c %Y "$EVENT_DB")
          test "$before" = "$after"
          ! grep -q 'must-not-leak' "$tmpdir/inspect.json"
          grep -q '"read_only": true' "$tmpdir/list.json"
          grep -q '"delivery_retry": false' "$tmpdir/explain.json"
      - name: Validate documentation, configuration, and shell templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          grep -F -- '- [x] `P1-07`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P1-08`' docs/attendance-platform-plan.md
          test -s docs/event-operations-cli.md
          python event_admin.py --help | grep -F 'Delivery retry/cancel is intentionally unavailable'
          git diff --check
      - name: Publish clean stacked branch
        env:
          BASE_SHA: 28828795ad57cb8788578f1ee7d877b07e74796b
          TARGET_BRANCH: agent/p1-event-operations
        run: |
          git reset "$BASE_SHA"
          rm -f p1_apply_event_operations.py
          rm -f p1_event_operations_final.*.part
          rm -f .github/workflows/p1-event-operations.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          README.md
          docs/attendance-platform-plan.md
          docs/event-operations-cli.md
          docs/processing-leases-policy.md
          event_admin.py
          event_operations.py
          runtime_state.py
          test_event_admin.py
          test_runtime_state.py
          test_secure_sync.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'add event inspection and audited operator resolution' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
