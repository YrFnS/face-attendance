name: P1 runtime state migrations

on:
  push:
    branches:
      - agent/p1-runtime-state-migrations-stage

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply reviewed P1 payload
        run: |
          python p1_apply_runtime_state.py
          python p1_fix_post_runtime_state.py
          python p1_post_runtime_state.py
          python p1_backup_portability.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flask>=3.0.3,<4" \
            "gunicorn>=26.0.0,<27" \
            "numpy>=1.26.4" \
            "opencv-python-headless>=4.10.0,<5" \
            "pyftpdlib[ssl]>=2.0.1,<3" \
            "requests>=2.32.3,<3" \
            "cryptography>=43,<48"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Run repository tests
        run: |
          python -m unittest -v \
            test_embedding_gallery.py \
            test_gallery_contract.py \
            test_camera_sources.py \
            test_ftp_receiver.py \
            test_match_employee.py \
            test_secure_sync.py \
            test_gallery_release.py \
            test_legacy_gallery_converter.py \
            test_runtime_policy.py \
            test_model_runtime.py \
            test_runtime_state.py \
            test_web_security.py \
            test_web_admin.py \
            test_model_manifest.py \
            test_pad.py \
            test_production_readiness.py \
            test_watch_service.py \
            test_canonical_watcher.py \
            test_install_linux.py
      - name: Exercise migration administration CLI
        run: |
          tmpdir=$(mktemp -d)
          python runtime_state_admin.py migrate --database "$tmpdir/runtime_state.sqlite3"
          python runtime_state_admin.py verify --database "$tmpdir/runtime_state.sqlite3"
          python runtime_state_admin.py backup \
            --database "$tmpdir/runtime_state.sqlite3" \
            --backup-dir "$tmpdir/backups" \
            --reason ci-smoke
          backup=$(find "$tmpdir/backups" -name '*.sqlite3' -type f | head -n 1)
          python runtime_state_admin.py verify-backup "$backup"
      - name: Validate documentation and templates
        run: |
          python -m json.tool config.example.json >/dev/null
          bash -n install_linux.sh
          bash -n deploy/firewall/ufw-rules.example.sh
          grep -F -- '- [x] `P1-01`' docs/attendance-platform-plan.md
          grep -F -- '- [x] `P1-02`' docs/attendance-platform-plan.md
          grep -F -- 'copied together to encrypted off-host storage' docs/runtime-state-migrations.md
          git diff --check
      - name: Publish clean stacked branch
        env:
          BASE_SHA: ff5288b6d42a342b699cff527c728d205229c6cd
          TARGET_BRANCH: agent/p1-runtime-state-migrations
        run: |
          rm -f p1_payload.part.* p1_apply_runtime_state.py
          rm -f p1_post_runtime_state.py p1_fix_post_runtime_state.py
          rm -f p1_backup_portability.py
          rm -f .github/workflows/p1-runtime-state-migrations.yml
          git add -A
          git diff --cached --check
          echo "Final changed files:"
          git diff --cached --name-only
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'add versioned runtime state migrations and restore tooling' | git commit-tree "$tree" -p "$BASE_SHA")
          git push --force origin "$commit:refs/heads/$TARGET_BRANCH"
