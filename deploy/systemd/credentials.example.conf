# Copy the required lines into a systemd drop-in for each Face Attendance service.
# Example:
#   sudo systemctl edit face-attendance-web.service
# Source files must be root-owned and mode 0600 under /etc/face-attendance/credentials.

[Service]
# Web administration
LoadCredential=web_admin_password_hash:/etc/face-attendance/credentials/web_admin_password_hash
LoadCredential=web_session_secret:/etc/face-attendance/credentials/web_session_secret
LoadCredential=gallery_export_token_2026_q3:/etc/face-attendance/credentials/gallery_export_token_2026_q3

# Gallery synchronization
LoadCredential=central_gallery_token_2026_q3:/etc/face-attendance/credentials/central_gallery_token_2026_q3

# Camera source attribution
LoadCredential=camera_source_receipt_secret:/etc/face-attendance/credentials/camera_source_receipt_secret
LoadCredential=ftp_camera_in_password:/etc/face-attendance/credentials/ftp_camera_in_password
LoadCredential=ftp_camera_out_password:/etc/face-attendance/credentials/ftp_camera_out_password

# External services used by the watcher
LoadCredential=pad_http_token:/etc/face-attendance/credentials/pad_http_token
LoadCredential=frappe_api_secret:/etc/face-attendance/credentials/frappe_api_secret

# config.json references these values as systemd://<credential-name>.
# systemd exposes the files through the process-specific CREDENTIALS_DIRECTORY.
